<text x="840" y="114" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" letter-spacing="2.4" fill="#9CA3AF">V0.2 / MIT</text>
<text x="36" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4" fill="#FAFAF7">vinplain<span fill="#6EA8FF">.</span></text>
<text x="40" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" letter-spacing="-0.5" fill="#FAFAF7">The public record, in plain code.</text>
<text x="41" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#9CA3AF">VIN decode, recalls, complaints, crash ratings, and fuel economy.</text>
<text x="41" y="263" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#9CA3AF">No API key. No black box. No per-lookup fee.</text>
